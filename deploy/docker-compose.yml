services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: devops-tools-backend:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./config/app.conf:/etc/devops-tools/app.conf:ro
      - ./config/redis.conf:/etc/devops-tools/redis.conf:ro
      - ./data:/data
    environment:
      APP_CONFIG_FILE: /etc/devops-tools/app.conf
      REDIS_CONFIG_FILE: /etc/devops-tools/redis.conf
      RUN_MIGRATE: "1"
      RUN_COLLECTSTATIC: "1"
    depends_on:
      redis:
        condition: service_started
      guacd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: devops-tools-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/static:/srv/devops-static:ro

  transfer-worker:
    image: devops-tools-backend:latest
    restart: unless-stopped
    command: ["python", "manage.py", "run_database_transfer_worker", "--poll-interval", "1"]
    environment:
      APP_CONFIG_FILE: /etc/devops-tools/app.conf
      REDIS_CONFIG_FILE: /etc/devops-tools/redis.conf
      RUN_MIGRATE: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - ./config/app.conf:/etc/devops-tools/app.conf:ro
      - ./config/redis.conf:/etc/devops-tools/redis.conf:ro
      - ./data:/data
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

volumes:
  redis-data:
