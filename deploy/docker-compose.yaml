services:
  backend:
    image: devops-tools-backend:latest
    restart: unless-stopped
    expose:
      - '8000'
    volumes:
      - ./app.conf:/etc/devops-tools/app.conf:ro
      - ./redis.conf:/etc/devops-tools/redis.conf:ro
      - ./data/devops_data:/data
      - ./data/devops_static:/app/backend/staticfiles
    depends_on:
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    image: devops-tools-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 8088:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/devops_static:/srv/devops-static:ro
  transfer-worker:
    image: devops-tools-backend:latest
    restart: unless-stopped
    command:
      - transfer-worker
    volumes:
      - ./app.conf:/etc/devops-tools/app.conf:ro
      - ./redis.conf:/etc/devops-tools/redis.conf:ro
      - ./data/devops_data:/data
      - ./data/devops_static:/app/backend/staticfiles
    depends_on:
      backend:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
