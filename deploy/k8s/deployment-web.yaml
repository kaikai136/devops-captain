apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-tools-web
  namespace: middleware
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-tools-web
  template:
    metadata:
      labels:
        app: devops-tools-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_NODE_NAME
      containers:
        - name: frontend
          image: registry.cn-beijing.aliyuncs.com/kaikai136/devops-tools-frontend:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: static
              mountPath: /srv/devops-static
              readOnly: true
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: static
          hostPath:
            path: /data/middleware/devops-tools/static
            type: DirectoryOrCreate
        - name: web-config
          configMap:
            name: devops-tools-web-config
