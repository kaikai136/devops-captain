apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-tools-web
  namespace: cockpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-tools-web
  template:
    metadata:
      labels:
        app: devops-tools-web
    spec:
      # nodeSelector:
      #   kubernetes.io/hostname: k8svip-161
      containers:
        - name: frontend
          image: registry.cn-beijing.aliyuncs.com/kaikai136/devops-tools-frontend:v5.0.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: web-config
          configMap:
            name: devops-tools-web-config
