apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-tools-redis
  namespace: middleware
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-tools-redis
  template:
    metadata:
      labels:
        app: devops-tools-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_NODE_NAME
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --appendonly
            - 'yes'
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
      volumes:
        - name: data
          hostPath:
            path: /data/middleware/devops-tools/redis
            type: DirectoryOrCreate
