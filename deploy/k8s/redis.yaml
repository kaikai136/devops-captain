apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: devops-tools-redis}
  template:
    metadata:
      labels: {app: devops-tools-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: devops-tools-redis}
  ports: [{port: 6379, targetPort: 6379}]
