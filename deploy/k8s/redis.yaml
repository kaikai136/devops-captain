apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-tools-redis
  namespace: cockpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-tools-redis
  template:
    metadata:
      labels:
        app: devops-tools-redis
    spec:
      # nodeSelector:
      #   # Redis data is local to this node; do not change without migrating /data.
      #   kubernetes.io/hostname: k8svip-161
      containers:
        - name: redis
          image: registry.cn-beijing.aliyuncs.com/kaikai136/redis:8.0
          args:
            - --appendonly
            - 'yes'
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
      volumes:

        - name: data
          persistentVolumeClaim:
            claimName: devops-tools-runtime-pvc
