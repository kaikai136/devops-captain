apiVersion: apps/v1
kind: Deployment
metadata: {name: devops-tools-app}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: devops-tools}
  template:
    metadata:
      labels: {app: devops-tools}
    spec:
      initContainers:
        - name: migrate
          image: devops-tools-backend:latest
          args: ["true"]
          env:
            - {name: APP_CONFIG_FILE, value: /etc/devops-tools/app.conf}
            - {name: REDIS_CONFIG_FILE, value: /etc/devops-tools/redis.conf}
            - {name: RUN_MIGRATE, value: "1"}
            - {name: RUN_COLLECTSTATIC, value: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/devops-tools, readOnly: true}
      containers:
        - name: backend
          image: devops-tools-backend:latest
          env:
            - {name: APP_CONFIG_FILE, value: /etc/devops-tools/app.conf}
            - {name: REDIS_CONFIG_FILE, value: /etc/devops-tools/redis.conf}
            - {name: RUN_MIGRATE, value: "0"}
            - {name: RUN_COLLECTSTATIC, value: "0"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/devops-tools, readOnly: true}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /api/health/, port: 8000}
          startupProbe:
            httpGet: {path: /api/health/, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
        - name: transfer-worker
          image: devops-tools-backend:latest
          args: ["python", "manage.py", "run_database_transfer_worker", "--poll-interval", "1"]
          env:
            - {name: APP_CONFIG_FILE, value: /etc/devops-tools/app.conf}
            - {name: REDIS_CONFIG_FILE, value: /etc/devops-tools/redis.conf}
            - {name: RUN_MIGRATE, value: "0"}
            - {name: RUN_COLLECTSTATIC, value: "0"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/devops-tools, readOnly: true}
        - name: frontend
          image: devops-tools-frontend:latest
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: data, mountPath: /srv/devops-static, subPath: static, readOnly: true}
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf, readOnly: true}
          readinessProbe:
            httpGet: {path: /, port: 80}
        - name: guacd
          image: guacamole/guacd:1.5.5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: devops-tools-data}
        - name: config
          configMap: {name: devops-tools-config}
