apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-tools-app
  namespace: cockpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-tools-app
  template:
    metadata:
      labels:
        app: devops-tools-app
    spec:
      # nodeSelector:
      #   kubernetes.io/hostname: k8svip-161
      containers:
        - name: backend
          image: registry.cn-beijing.aliyuncs.com/kaikai136/devops-tools-backend:v5.0.0
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data

            - name: app-config
              mountPath: /etc/devops-tools
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health/
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
        - name: transfer-worker
          image: registry.cn-beijing.aliyuncs.com/kaikai136/devops-tools-backend:v5.0.0
          args:
            - transfer-worker
          env:
            - name: BACKEND_HEALTH_URL
              value: http://127.0.0.1:8000/api/health/
          volumeMounts:
            - name: data
              mountPath: /data
            - name: app-config
              mountPath: /etc/devops-tools
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 1Gi
        - name: guacd
          image: registry.cn-beijing.aliyuncs.com/kaikai136/guacd:1.5.5
      volumes:
        # - name: data
        #   hostPath:
        #     path: /data/middleware/devops-tools/data
        #     type: DirectoryOrCreate


        - name: data
          persistentVolumeClaim:
            claimName: devops-tools-runtime-pvc

        - name: app-config
          secret:
            secretName: devops-tools-config
