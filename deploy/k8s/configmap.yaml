apiVersion: v1
kind: ConfigMap
metadata: {name: devops-tools-config}
data:
  app.conf: |
    # Safe defaults for local, test, and controlled intranet deployments.
    # Production deployments should restrict hosts/origins and keep private overrides out of Git.
    TZ=Asia/Shanghai

    # Leave empty to generate and persist a unique key in ../data/django-secret-key.
    DJANGO_SECRET_KEY=
    DJANGO_SECRET_KEY_FILE=/data/data/django-secret-key
    DJANGO_DEBUG=0
    DJANGO_ALLOWED_HOSTS=*
    DJANGO_CSRF_TRUSTED_ORIGINS=
    DJANGO_CORS_ALLOW_ALL_ORIGINS=0
    DJANGO_CORS_ALLOWED_ORIGINS=
    DJANGO_MEDIA_ROOT=/data/media
    DJANGO_SERVE_MEDIA_FILES=1
    DJANGO_STATIC_ROOT=/data/static
    REDIS_CONFIG_FILE=/etc/devops-tools/redis.conf

    DATABASE_TRANSFER_RETENTION_DAYS=7
    DATABASE_TRANSFER_CHUNK_BYTES=8388608
    DATABASE_TRANSFER_BATCH_ROWS=500
    DATABASE_TRANSFER_TASK_TIMEOUT_SECONDS=86400
    DATABASE_TRANSFER_MIN_FREE_BYTES=2147483648
    DATABASE_TRANSFER_MAX_ROWS=0
    DATABASE_TRANSFER_MAX_TABLES=0
    DATABASE_TRANSFER_MAX_UPLOAD_BYTES=0
    DATABASE_TRANSFER_MAX_RESULT_BYTES=0
    DATABASE_TRANSFER_MAX_SQL_STATEMENT_BYTES=67108864


    # Choose mysql or sqlite. MySQL connects to the remote host configured below;
    # Docker Compose does not start a local MySQL service.
    # Change MySQL host, user, and password before production use.
    DATABASE_ENGINE=sqlite3

    DATABASE_HOST=mysql.example.com
    DATABASE_PORT=3306
    DATABASE_NAME=devops_tools
    DATABASE_USER=devops_tools
    DATABASE_PASSWORD=devops-tools-password

    # Used only when DATABASE_ENGINE=sqlite.
    DJANGO_DB_PATH=/data/data/db.sqlite3
    DATABASE_ASSET_SQLITE_ROOT=/data/data/database_assets

    GUACD_HOST=127.0.0.1
    GUACD_PORT=4822

    RDP_RECORDING_ROOT=/data/recordings
    RDP_RECORDING_RETENTION_DAYS=30
    RDP_RECORDING_DEFAULT_ENABLED=0

    BULK_EXECUTION_MAX_TARGETS=500
    BULK_EXECUTION_FORKS=10
    BULK_EXECUTION_TIMEOUT_SECONDS=300
    BULK_EXECUTION_RUN_ASYNC=1
    DATA_UPLOAD_MAX_NUMBER_FILES=1000
  redis.conf: |
    REDIS_URL=redis://redis:6379/3
  nginx.conf: |
    map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
      location /admin/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
      location /media/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
      location /static/ { alias /srv/devops-static/; expires 7d; add_header Cache-Control "public"; }
      location /ws/ { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; proxy_read_timeout 3600s; }
      location / { try_files $uri $uri/ /index.html; }
    }
