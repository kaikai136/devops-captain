apiVersion: v1
kind: Service
metadata:
  name: devops-tools-app
  namespace: cockpit
spec:
  type: ClusterIP
  selector:
    app: devops-tools-app
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-tools-web
  namespace: cockpit
spec:
  type: ClusterIP
  selector:
    app: devops-tools-web
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: devops-tools-redis
  namespace: cockpit
spec:
  type: ClusterIP
  selector:
    app: devops-tools-redis
  ports:
    - port: 6379
      targetPort: 6379
