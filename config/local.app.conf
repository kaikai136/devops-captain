# Local startup config shared by backend/start-wsl.ps1 and frontend/vite.config.ts.
# Keep this file safe to commit. Put real production values in data/config/app.conf.

# Local process
APP_CONFIG_FILE=config/local.app.conf
BACKEND_HOST=0.0.0.0
BACKEND_PORT=8001
FRONTEND_HOST=0.0.0.0
FRONTEND_PORT=5115
VITE_API_TARGET=http://127.0.0.1:8001
VITE_WS_TARGET=ws://127.0.0.1:8001
REDIS_CONFIG_FILE=config/redis.app.conf

# Django core
TZ=Asia/Shanghai
DJANGO_SECRET_KEY=local-dev-secret
DJANGO_SECRET_KEY_FILE=backend/data/django-secret-key
DJANGO_DEBUG=1
DJANGO_ALLOWED_HOSTS=*
DJANGO_CSRF_TRUSTED_ORIGINS=
DJANGO_CORS_ALLOW_ALL_ORIGINS=1
DJANGO_CORS_ALLOWED_ORIGINS=

# Database
DATABASE_ENGINE=sqlite
# DJANGO_DB_PATH=/mnt/c/Users/kaikai/Desktop/django-vue/backend/data/db.sqlite3
#DJANGO_DB_PATH=/app/data/db.sqlite3
DATABASE_HOST=
DATABASE_PORT=3306
DATABASE_NAME=devops_tools
DATABASE_USER=devops_tools
DATABASE_PASSWORD=

# Cache
DASHBOARD_CACHE_SECONDS=30
EGRESS_CACHE_SECONDS=300
FEATURE_PERMISSION_CACHE_SECONDS=300

# Static/media
DJANGO_STATIC_URL=/static/
DJANGO_STATIC_ROOT=backend/staticfiles
#DJANGO_FRONTEND_DIST_DIR=backend/frontend_dist
DJANGO_MEDIA_URL=/media/
